name: Build Full APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK and NDK
        run: |
          SDKM="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Download engine libs (libGTASA etc.)
        run: |
          curl -fL -o engine-v7a.zip "https://github.com/zacem1150-byte/launcher/releases/download/v1/engine-v7a.zip"
          mkdir -p app/src/main/jniLibs
          unzip -o engine-v7a.zip -d app/src/main/jniLibs
          ls -l app/src/main/jniLibs/armeabi-v7a

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
