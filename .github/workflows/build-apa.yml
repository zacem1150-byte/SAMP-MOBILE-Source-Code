name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Build native ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build libsamp.so (${{ matrix.abi }})
        run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk APP_ABI=${{ matrix.abi }} -j$(nproc)

      - name: Upload libsamp.so
        uses: actions/upload-artifact@v4
        with:
          name: libsamp-${{ matrix.abi }}
          path: libs/${{ matrix.abi }}/libsamp.so
          if-no-files-found: error

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub-hosted ubuntu runners already ship the Android SDK
      # (cmdline-tools, platform-tools, build-tools, android-34 platform),
      # so no SDK setup action is needed here.
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
